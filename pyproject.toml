[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-pi-token-reduction"
version = "0.1.0"
description = "Pi extension that uses Jev to trim retrieved tool output before the model sees it"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Optional: trace Pi runs to MLflow; Unity Catalog trace storage needs 3.14+.
mlflow = ["mlflow[databricks]>=3.14"]

[project.scripts]
jev-router = "jev_router.cli:main"

[tool.setuptools.packages.find]
include = ["jev_router*"]
